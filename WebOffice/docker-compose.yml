services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: weboffice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "48732:5432" # uncommon host port to avoid local collisions (see memory: feedback-uncommon-ports)

  redis:
    # Still unused — collab-server runs as a single instance in this Phase 1
    # build. Needed once it's horizontally scaled (@hocuspocus/extension-redis
    # for cross-replica awareness/doc sync), which is Phase 5 (PLAN.md §7/§9).
    image: redis:7
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: weboffice
      MINIO_ROOT_PASSWORD: weboffice_dev_secret
    volumes:
      - minio-data:/data # bind-mount a host path here instead for on-prem (PLAN.md §1)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "48733:9000" # uncommon host port to avoid local collisions (see memory: feedback-uncommon-ports)
      - "48734:9001"

  clamav:
    # PLAN.md §22. First boot downloads the virus database (freshclam) and can
    # take a few minutes — api-files retries/reports 503 until clamd is ready.
    image: clamav/clamav:1.4
    platform: linux/amd64 # no arm64 build published; runs under emulation on Apple Silicon
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  api-files:
    build: ./services/api-files
    environment:
      DATABASE_URL: postgresql://weboffice_app:weboffice_app_dev_password@postgres:5432/weboffice
      JWT_SECRET: dev-only-change-me
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: weboffice
      MINIO_SECRET_KEY: weboffice_dev_secret
      MINIO_BUCKET: weboffice
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      MALWARE_SCAN_ENABLED: "true"
      CORS_ORIGINS: http://localhost:48737
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_started
    ports:
      - "48735:8000" # uncommon host port to avoid local collisions (see memory: feedback-uncommon-ports)

  collab-server:
    # PLAN.md §7/§9 Phase 1 — Hocuspocus/Yjs real-time editing backend.
    # Talks to Postgres directly (as weboffice_app, same RLS-scoped pattern as
    # api-files) and to MinIO for Yjs snapshot persistence (doc_snapshots).
    build: ./services/collab-server
    volumes:
      - ./services/collab-server/src:/app/src
    environment:
      DATABASE_URL: postgresql://weboffice_app:weboffice_app_dev_password@postgres:5432/weboffice
      JWT_SECRET: dev-only-change-me
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: weboffice
      MINIO_SECRET_KEY: weboffice_dev_secret
      MINIO_BUCKET: weboffice
      PORT: "1234"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "48736:1234" # uncommon host port to avoid local collisions (see memory: feedback-uncommon-ports)

  web:
    # Minimal React/Tiptap frontend — dev server only (see services/web/Dockerfile);
    # a production static build belongs in Phase 5 hardening, not here.
    build: ./services/web
    volumes:
      - ./services/web/src:/app/src
      - ./services/web/index.html:/app/index.html
    environment:
      VITE_API_URL: http://localhost:48735
      VITE_COLLAB_WS_URL: ws://localhost:48736
    depends_on:
      - api-files
      - collab-server
    ports:
      - "48737:5173" # uncommon host port to avoid local collisions (see memory: feedback-uncommon-ports)

volumes:
  pg-data:
  redis-data:
  minio-data:
  clamav-data:
